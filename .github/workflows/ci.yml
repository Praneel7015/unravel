name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fdroid-purity:
    name: F-Droid purity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify bundled IBM Plex fonts
        run: |
          for f in \
            IBMPlexSerif-Regular.ttf \
            IBMPlexSerif-Medium.ttf \
            IBMPlexSerif-Italic.ttf \
            IBMPlexSans-Regular.ttf \
            IBMPlexSans-SemiBold.ttf \
            IBMPlexMono-Regular.ttf \
            IBMPlexMono-Medium.ttf
          do
            test -s "packages/core/assets/fonts/$f"
          done

      - name: F-Droid proprietary dependency and cloud URL audit
        run: |
          echo "Auditing apps/unravel_foss, packages/sync_foss and packages/core for forbidden proprietary references..."
          if grep -RInE "(purchases_flutter|supabase_flutter|firebase_|com\.android\.billingclient|com\.google\.android\.gms|unravel_sync_store|supabase\.co)" apps/unravel_foss packages/sync_foss/lib packages/sync_foss/pubspec.yaml packages/core/lib packages/core/pubspec.yaml; then
            echo "ERROR: Proprietary SDK or commercial cloud reference detected in FOSS tree!"
            exit 1
          fi
          echo "PASS: Zero proprietary dependencies or hardcoded commercial URLs in FOSS tree."

      - name: Verify Fastlane F-Droid metadata limits
        run: |
          TITLE_LEN=$(head -n 1 fastlane/metadata/android/en-US/title.txt | wc -m)
          SHORT_LEN=$(head -n 1 fastlane/metadata/android/en-US/short_description.txt | wc -m)
          FULL_LEN=$(wc -m < fastlane/metadata/android/en-US/full_description.txt)
          test "$TITLE_LEN" -le 31
          test "$SHORT_LEN" -le 81
          test "$FULL_LEN" -le 4000
          for f in fastlane/metadata/android/en-US/changelogs/*.txt; do
            test "$(wc -c < "$f")" -le 500
          done

      - name: Verify app versions match the release version
        run: |
          root="$(grep -E '^version:' pubspec.yaml)"
          for app in apps/unravel_foss apps/unravel_store; do
            line="$(grep -E '^version:' "$app/pubspec.yaml")"
            if [ "$line" != "$root" ]; then
              echo "ERROR: $app/pubspec.yaml has '$line' but the root pubspec.yaml has '$root'."
              exit 1
            fi
          done

  analyze-test:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Audit the FOSS app's resolved dependency tree
        # Catches proprietary SDKs pulled in transitively, e.g. through packages/core.
        working-directory: apps/unravel_foss
        run: |
          flutter pub deps --json | python3 -c '
          import json, re, sys
          deps = json.load(sys.stdin)
          packages = {p["name"]: p for p in deps["packages"]}
          seen, stack = set(), ["unravel_foss"]
          while stack:
              name = stack.pop()
              if name in seen or name not in packages:
                  continue
              seen.add(name)
              stack.extend(packages[name].get("dependencies", []))
          banned = re.compile(r"^(purchases_.*|supabase.*|gotrue|postgrest|realtime_client|storage_client|firebase_.*|google_mobile_ads|in_app_purchase.*|unravel_sync_store)$")
          bad = sorted(n for n in seen if banned.match(n))
          if bad:
              sys.exit("ERROR: proprietary packages reachable from unravel_foss: " + ", ".join(bad))
          print(f"PASS: {len(seen)} packages reachable from unravel_foss, none proprietary.")
          '

      - name: Check formatting
        # Generated Drift code (*.g.dart) is left as build_runner writes it.
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' ':!:*.g.dart')

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: |
          for pkg in packages/core packages/sync_foss packages/sync_store; do
            echo "::group::flutter test $pkg"
            (cd "$pkg" && flutter test --coverage)
            # lcov paths are package-relative; make them repo-relative for Codecov.
            sed -i "s|^SF:|SF:$pkg/|" "$pkg/coverage/lcov.info"
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/core/coverage/lcov.info,packages/sync_foss/coverage/lcov.info,packages/sync_store/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-foss-apk:
    name: Build FOSS APK
    needs: [fdroid-purity, analyze-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build FOSS release APK
        working-directory: apps/unravel_foss
        # Signed with the debug keystore; F-Droid signs its own builds.
        run: flutter build apk --release --no-pub

      - name: Upload app.unravel.foss APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unravel-foss-release-apk
          path: apps/unravel_foss/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
