name: F-Droid Purity, Test Suite & FOSS APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-foss:
    name: Analyze, Test & Build app.unravel.foss
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify bundled IBM Plex fonts
        run: |
          for f in \
            IBMPlexSerif-Regular.ttf \
            IBMPlexSerif-Medium.ttf \
            IBMPlexSerif-Italic.ttf \
            IBMPlexSans-Regular.ttf \
            IBMPlexSans-SemiBold.ttf \
            IBMPlexMono-Regular.ttf \
            IBMPlexMono-Medium.ttf
          do
            test -s "packages/core/assets/fonts/$f"
          done

      - name: F-Droid proprietary dependency and cloud URL audit
        run: |
          echo "Auditing apps/unravel_foss and packages/sync_foss for forbidden proprietary references..."
          if grep -RInE "(purchases_flutter|supabase_flutter|firebase_|com\.android\.billingclient|com\.google\.android\.gms|unravel_sync_store|supabase\.co)" apps/unravel_foss packages/sync_foss/lib packages/sync_foss/pubspec.yaml; then
            echo "ERROR: Proprietary SDK or commercial cloud reference detected in FOSS tree!"
            exit 1
          fi
          echo "PASS: Zero proprietary dependencies or hardcoded commercial URLs in FOSS tree."

      - name: Verify Fastlane F-Droid metadata limits
        run: |
          TITLE_LEN=$(head -n 1 fastlane/metadata/android/en-US/title.txt | wc -m)
          SHORT_LEN=$(head -n 1 fastlane/metadata/android/en-US/short_description.txt | wc -m)
          FULL_LEN=$(wc -m < fastlane/metadata/android/en-US/full_description.txt)
          CHANGELOG_BYTES=$(wc -c < fastlane/metadata/android/en-US/changelogs/1.txt)
          test "$TITLE_LEN" -le 31
          test "$SHORT_LEN" -le 81
          test "$FULL_LEN" -le 4000
          test "$CHANGELOG_BYTES" -le 500

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Run Dart static analysis
        run: dart analyze packages/core packages/sync_foss packages/sync_store apps/unravel_foss apps/unravel_store

      - name: Run unit and widget tests
        run: |
          flutter test packages/core/test/unravel_core_test.dart
          flutter test packages/sync_foss/test/sync_foss_test.dart
          flutter test packages/sync_store/test/sync_store_test.dart

      - name: Build FOSS release APK
        working-directory: apps/unravel_foss
        run: flutter build apk --release --no-pub

      - name: Upload app.unravel.foss APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unravel-foss-release-apk
          path: apps/unravel_foss/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
