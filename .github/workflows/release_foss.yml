name: Release FOSS APK

# Builds the open-source app, creates a version tag from
# apps/unravel_foss/pubspec.yaml, and publishes the APK to GitHub Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-foss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-foss:
    name: Build, tag, and release app.unravel.foss
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read FOSS version from pubspec
        id: version
        run: |
          line="$(grep -E '^version:' apps/unravel_foss/pubspec.yaml | head -n1)"
          raw="${line#version: }"
          raw="$(echo "$raw" | tr -d '[:space:]')"
          name="${raw%%+*}"
          code="${raw##*+}"
          if [ "$name" = "$raw" ]; then
            code="1"
          fi
          tag="v${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "FOSS version ${name} (build ${code}) → tag ${tag}"

      - name: Install workspace dependencies
        run: flutter pub get

      - name: F-Droid proprietary dependency audit
        run: |
          if grep -RInE "(purchases_flutter|supabase_flutter|firebase_|com\.android\.billingclient|com\.google\.android\.gms|unravel_sync_store|supabase\.co)" apps/unravel_foss packages/sync_foss/lib packages/sync_foss/pubspec.yaml; then
            echo "ERROR: Proprietary SDK or commercial cloud reference detected in FOSS tree!"
            exit 1
          fi

      - name: Run FOSS-facing tests
        run: |
          flutter test packages/core/test/unravel_core_test.dart
          flutter test packages/sync_foss/test/sync_foss_test.dart

      - name: Build FOSS release APK
        working-directory: apps/unravel_foss
        run: flutter build apk --release --no-pub

      - name: Stage release APK
        run: |
          mkdir -p dist
          cp apps/unravel_foss/build/app/outputs/flutter-apk/app-release.apk \
            "dist/unravel-foss-${{ steps.version.outputs.name }}.apk"
          ls -lh dist

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Uploading a fresh APK asset."
            gh release upload "$TAG" "dist/unravel-foss-${VERSION}.apk" --clobber
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally/remotely without a release."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Unravel FOSS ${VERSION}"
            git push origin "$TAG"
          fi

          gh release create "$TAG" \
            "dist/unravel-foss-${VERSION}.apk" \
            --title "Unravel FOSS ${VERSION}" \
            --notes "$(cat <<EOF
          Open-source build of Unravel (\`app.unravel.foss\`).

          - Version: \`${VERSION}\`
          - Version code: \`${CODE}\`
          - Package: \`app.unravel.foss\`
          - Signed with the debug keystore for CI smoke installs. F-Droid and store builds replace signing.

          Install the APK below, or rebuild from this tag.
          EOF
          )"
