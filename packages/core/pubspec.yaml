name: unravel_core
description: Shared UI, Circadian Theme Engine, local Drift SQLite database, client-side AES-256-GCM envelope encryption, offline local notifications, and abstract sync/AI interfaces.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  cryptography: ^2.7.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: IBM Plex Serif
      fonts:
        - asset: assets/fonts/IBMPlexSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSerif-Italic.ttf
          weight: 400
          style: italic
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
